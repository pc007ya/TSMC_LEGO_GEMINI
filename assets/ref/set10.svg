<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#162338"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glass10" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0.88"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky10)"/>
  <!-- Sloped Shenzhen Nanshan Podium & Reflection Pool -->
  <polygon points="80,435 720,435 680,385 120,385" fill="#1e4620"/>
  <rect x="290" y="398" width="220" height="16" rx="4" fill="#3ac5ed" opacity="0.8"/>
  <!-- West Tower Core (195m / 40F) -->
  <rect x="235" y="75" width="46" height="320" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <!-- East Tower Core (213m / 44F) -->
  <rect x="515" y="48" width="46" height="347" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <!-- West Tower Cantilevered Floating Glass Boxes + Green Roof Terraces -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <rect x="155" y="290" width="90" height="54" fill="url(#glass10)"/>
    <rect x="155" y="285" width="90" height="5" fill="#22c55e"/>
    <rect x="275" y="220" width="95" height="60" fill="url(#glass10)"/>
    <rect x="275" y="215" width="95" height="5" fill="#22c55e"/>
    <rect x="148" y="155" width="96" height="56" fill="url(#glass10)"/>
    <rect x="148" y="150" width="96" height="5" fill="#22c55e"/>
    <rect x="275" y="92" width="88" height="54" fill="url(#glass10)"/>
    <rect x="275" y="87" width="88" height="5" fill="#22c55e"/>
  </g>
  <!-- East Tower Cantilevered Floating Glass Boxes + Quadruple-Height Drone Flight Lab -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <rect x="555" y="285" width="96" height="56" fill="url(#glass10)"/>
    <rect x="555" y="280" width="96" height="5" fill="#22c55e"/>
    <rect x="425" y="215" width="95" height="58" fill="url(#glass10)"/>
    <rect x="425" y="210" width="95" height="5" fill="#22c55e"/>
    <rect x="555" y="142" width="98" height="60" fill="url(#glass10)"/>
    <rect x="555" y="137" width="98" height="5" fill="#22c55e"/>
    <rect x="432" y="64" width="90" height="58" fill="url(#glass10)"/>
    <rect x="432" y="59" width="90" height="5" fill="#22c55e"/>
  </g>
  <!-- Exposed V-Shaped Mega-Trusses -->
  <g stroke="#cbd5e1" stroke-width="2.5" opacity="0.85">
    <line x1="155" y1="290" x2="235" y2="344"/><line x1="275" y1="220" x2="370" y2="280"/>
    <line x1="555" y1="142" x2="653" y2="202"/><line x1="432" y1="64" x2="522" y2="122"/>
  </g>
  <!-- Iconic 105m High-Altitude Steel Suspension Skybridge -->
  <rect x="281" y="200" width="234" height="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 281 142 Q 398 205 515 142" fill="none" stroke="#f8fafc" stroke-width="2.5"/>
  <g stroke="#cbd5e1" stroke-width="1.2">
    <line x1="320" y1="168" x2="320" y2="200"/><line x1="360" y1="184" x2="360" y2="200"/>
    <line x1="400" y1="190" x2="400" y2="200"/><line x1="440" y1="184" x2="440" y2="200"/>
    <line x1="480" y1="168" x2="480" y2="200"/>
  </g>
  <!-- Collector Banner -->
  <rect x="0" y="438" width="800" height="62" fill="#090d16" opacity="0.94"/>
  <rect x="34" y="454" width="6" height="30" fill="#3ac5ed"/>
  <text x="52" y="468" fill="#ffffff" font-family="Noto Sans TC, sans-serif" font-size="22" font-weight="800">大疆天空之城 DJI Sky City  #21044</text>
  <text x="52" y="489" fill="#93c5fd" font-family="Inter, sans-serif" font-size="12" font-weight="600">FOSTER + PARTNERS • 1:800 SCALE SUSPENDED TWIN TOWERS &amp; 105M SKYBRIDGE</text>
</svg>
