<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky8b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="55%" stop-color="#1b3a4b"/>
      <stop offset="100%" stop-color="#143d2c"/>
    </linearGradient>
    <pattern id="mesh2" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 3.5 L3.5 0 L7 3.5 L3.5 7 Z" fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="0.9"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#sky8b)"/>
  <!-- Shuinan Central Park Lawn -->
  <ellipse cx="400" cy="435" rx="395" ry="78" fill="#1d8f44" opacity="0.88"/>
  <path d="M 40 415 Q 240 375 400 400 T 760 410" fill="none" stroke="#cbd5e1" stroke-width="14" opacity="0.65"/>
  <!-- Organic Reflective Water Basin + 2 Circular 1F Glass Pavilions -->
  <ellipse cx="400" cy="395" rx="68" ry="18" fill="#3ac5ed" opacity="0.85" stroke="#e2e8f0" stroke-width="2"/>
  <ellipse cx="325" cy="378" rx="22" ry="12" fill="#e6f4fa" fill-opacity="0.7" stroke="#ffffff" stroke-width="1.5"/>
  <ellipse cx="475" cy="378" rx="22" ry="12" fill="#e6f4fa" fill-opacity="0.7" stroke="#ffffff" stroke-width="1.5"/>
  <!-- 8 Non-Orthogonal Multi-Angled & Rounded-Edge SANAA Pavilions -->
  <g stroke="#e2e8f0" stroke-width="1.6">
    <!-- West Museum Cluster (rotated & rounded) -->
    <g transform="translate(155,265) rotate(-14)">
      <rect x="-58" y="-68" width="116" height="136" rx="28" fill="#e6f4fa" fill-opacity="0.86"/>
      <rect x="-58" y="-68" width="116" height="136" rx="28" fill="url(#mesh2)"/>
    </g>
    <g transform="translate(260,225) rotate(11)">
      <rect x="-66" y="-92" width="132" height="184" rx="18" fill="#f6f7f9" fill-opacity="0.94"/>
      <rect x="-66" y="-92" width="132" height="184" rx="18" fill="url(#mesh2)"/>
    </g>
    <g transform="translate(330,270) rotate(18)">
      <rect x="-46" y="-65" width="92" height="130" rx="26" fill="#cfefff" fill-opacity="0.88"/>
      <rect x="-46" y="-65" width="92" height="130" rx="26" fill="url(#mesh2)"/>
    </g>
    <!-- East Library Cluster (rotated & rounded) -->
    <g transform="translate(470,270) rotate(-18)">
      <rect x="-46" y="-62" width="92" height="124" rx="26" fill="#cfefff" fill-opacity="0.88"/>
      <rect x="-46" y="-62" width="92" height="124" rx="26" fill="url(#mesh2)"/>
    </g>
    <g transform="translate(545,215) rotate(-12)">
      <rect x="-68" y="-98" width="136" height="196" rx="20" fill="#f6f7f9" fill-opacity="0.94"/>
      <rect x="-68" y="-98" width="136" height="196" rx="20" fill="url(#mesh2)"/>
    </g>
    <g transform="translate(650,268) rotate(15)">
      <rect x="-58" y="-66" width="116" height="132" rx="30" fill="#e6f4fa" fill-opacity="0.88"/>
      <rect x="-58" y="-66" width="116" height="132" rx="30" fill="url(#mesh2)"/>
    </g>
  </g>
  <!-- Serpentine Curved Rooftop Cultural Forest Skybridge -->
  <ellipse cx="400" cy="148" rx="155" ry="26" fill="none" stroke="#ffffff" stroke-width="8"/>
  <ellipse cx="400" cy="148" rx="155" ry="26" fill="none" stroke="#86efac" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- Park & Roof Trees -->
  <g fill="#22c55e" opacity="0.92">
    <circle cx="65" cy="378" r="24"/><circle cx="735" cy="378" r="24"/>
    <circle cx="290" cy="126" r="12"/><circle cx="515" cy="118" r="12"/>
  </g>
  <!-- Collector Banner -->
  <rect x="0" y="438" width="800" height="62" fill="#0f172a" opacity="0.92"/>
  <rect x="34" y="454" width="6" height="30" fill="#1d8f44"/>
  <text x="52" y="468" fill="#ffffff" font-family="Noto Sans TC, sans-serif" font-size="22" font-weight="800">臺中綠美圖 UCS 典藏版  #21042</text>
  <text x="52" y="489" fill="#86efac" font-family="Inter, sans-serif" font-size="12" font-weight="600">SANAA • 8 MULTI-ANGLED &amp; CURVED-EDGE PAVILIONS + CULTURAL FOREST</text>
</svg>
