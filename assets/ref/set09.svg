<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <pattern id="curtain" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#3ac5ed" fill-opacity="0.65"/>
      <path d="M0 0 H16 M0 0 V16" stroke="#e2e8f0" stroke-width="1.4"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#sky9)"/>
  <!-- Taiwan Boulevard Civic Plaza -->
  <polygon points="0,375 800,375 800,450 0,450" fill="#cbd5e1"/>
  <rect x="260" y="388" width="280" height="14" fill="#3ac5ed" opacity="0.8"/>
  <!-- Taichung City Hall: Giant Rectangular Portal Frame (Weber + Hofer) -->
  <!-- West Wing (Huizhong) + East Wing (Wenxin) + Upper Bridge (4F-10F) -->
  <g stroke="#94a3b8" stroke-width="2">
    <!-- Left Wing (Huizhong Building) -->
    <rect x="95" y="115" width="215" height="260" fill="url(#curtain)"/>
    <!-- Right Wing (Wenxin Building) -->
    <rect x="490" y="115" width="215" height="260" fill="url(#curtain)"/>
    <!-- Upper Bridge Spanning Central Hollow Portal -->
    <rect x="310" y="115" width="180" height="130" fill="url(#curtain)"/>
    <!-- Crisp Aluminum Roof Fascia -->
    <rect x="90" y="105" width="620" height="12" fill="#e2e8f0"/>
  </g>
  <!-- Central Hollow Open-Air Portal (川堂) -->
  <rect x="310" y="245" width="180" height="130" fill="#1e293b" fill-opacity="0.55" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Giant Outdoor Civic Plaza LED Screen -->
  <rect x="342" y="155" width="116" height="62" fill="#0f172a" stroke="#f8fafc" stroke-width="2"/>
  <rect x="348" y="161" width="104" height="50" fill="#38bdf8" opacity="0.85"/>
  <!-- Iconic Bright-Red Public Art Sculptures ("從過去到未來之間" & "塔之語") -->
  <polygon points="382,375 400,328 418,375" fill="none" stroke="#dc2626" stroke-width="5"/>
  <rect x="278" y="325" width="14" height="50" fill="#dc2626" rx="2"/>
  <rect x="508" y="325" width="14" height="50" fill="#dc2626" rx="2"/>
  <!-- Formal Plaza Canopy Trees -->
  <g fill="#1d8f44">
    <circle cx="52" cy="365" r="22"/><circle cx="748" cy="365" r="22"/>
    <circle cx="140" cy="382" r="14"/><circle cx="660" cy="382" r="14"/>
  </g>
  <!-- Collector Banner -->
  <rect x="0" y="438" width="800" height="62" fill="#0f172a" opacity="0.92"/>
  <rect x="34" y="454" width="6" height="30" fill="#c91a09"/>
  <text x="52" y="468" fill="#ffffff" font-family="Noto Sans TC, sans-serif" font-size="22" font-weight="800">臺中市政府・臺灣大道市政大樓 UCS  #21043</text>
  <text x="52" y="489" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="12" font-weight="600">TAICHUNG CITY HALL • WEBER + HOFER GLASS PORTAL &amp; CIVIC PLAZA</text>
</svg>
